<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBFC Recovery OS</title>
    <script>
      (() => {
        const key = "te-color-scheme";
        const stored = window.localStorage.getItem(key);
        const resolved = stored === "dark" ? "dark" : "light";
        if (stored !== resolved) {
          window.localStorage.setItem(key, resolved);
        }
        document.documentElement.setAttribute("data-mantine-color-scheme", resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
